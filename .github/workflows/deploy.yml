name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-flight run finish so a half-built
# site is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # The site is served from https://<user>.github.io/JULIE/
          VITE_BASE_PATH: /JULIE/

      - name: Verify the song shipped
        run: |
          # The track lives at the repo root and is copied into dist by the
          # juliet-song-asset plugin in vite.config.js. If this ever fails,
          # the music would 404 in production, so fail the deploy loudly.
          test -f "dist/Holy Place – Abundant Worship Lyrics Video.mp3" \
            || { echo "::error::Song file missing from dist/"; exit 1; }
          echo "Song bundled: $(du -h "dist/Holy Place – Abundant Worship Lyrics Video.mp3" | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
